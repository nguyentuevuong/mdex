<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link id="theme-style" rel="stylesheet" href="{{relativeLevel}}assets/themes/{{theme}}.css">
</head>

<body>
    <!-- Mobile Nav Header -->
    <div class="mobile-nav">
        <button id="menuToggle" aria-label="Toggle Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="mobile-logo">{{customHeader}}</div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Left Sidebar -->
    <nav class="sidebar-left" id="sidebarLeft">
        <div class="nav-header">
            {{customHeader}}
        </div>
        {{sidebar}}
    </nav>

    <!-- Main Content -->
    <div class="content">
        <header class="page-header">
            {{meta_date}}
            <h1>{{pageTitle}}</h1>
            {{meta_description}}
        </header>

        <main class="markdown-body">
            {{content}}
        </main>

        <footer class="page-footer">
            <div class="pagination">
                {{prevLink}}
                {{nextLink}}
            </div>
            {{customFooter}}
            <p class="copyright">Generated by <strong>mdex</strong> &bull; {{buildDate}}</p>
        </footer>
    </div>

    <!-- Right Sidebar (TOC) -->
    <aside class="sidebar-right">
        <h4>On this page</h4>
        {{toc}}
    </aside>

    <script src="{{relativeLevel}}assets/script.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true, theme: '{{mermaidTheme}}' });
    </script>
</body>

</html>
