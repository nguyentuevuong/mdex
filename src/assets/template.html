<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link id="theme-style" rel="stylesheet" href="{{relativeLevel}}assets/modern.css">

  <script src="{{relativeLevel}}assets/script.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.12.2/+esm';

    mermaid.initialize({ startOnLoad: true, theme: 'default' });
  </script>
</head>

<body class="flex flex-row">
  <!-- Left Sidebar -->
  <nav class="sidebar-left w-280px">
    <div class="nav-header">
      {{customHeader}}
    </div>
    {{sidebar}}
  </nav>

  <!-- Main Content -->
  <div class="content flex-grow">
    <header class="page-header">
      {{meta_date}}
      <h1>{{pageTitle}}</h1>
      {{meta_description}}
    </header>

    <main class="markdown-body">
      {{content}}
    </main>

    <footer class="page-footer">
      <div class="pagination">
        {{prevLink}}
        {{nextLink}}
      </div>
      {{customFooter}}
      <p class="copyright">Generated by <strong>mdex</strong> &bull; {{buildDate}}</p>
    </footer>
  </div>

  <!-- Right Sidebar (TOC) -->
  <aside class="sidebar-right w-240px">
    <h4>On this page</h4>
    {{toc}}
  </aside>
</body>
</html>
